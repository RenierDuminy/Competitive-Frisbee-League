<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Additional Information</title>
  <link rel="icon" href="page_icon.png" type="image/png">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <!-- Hero -->
  <header class="hero">
    <div class="hero-overlay">
      <img src="assets/images/SU Comm - Universal logo.jpg"
           alt="SU Comm Logo"
           class="hero-logo">
      <a href="index.html" class="home-button">Home</a>
    </div>
  </header>

  <main class="container">
    <!-- Field-size Image -->
    <section class="image-container">
      <h2>5v5 Field Layout</h2>
      <img src="assets/images/Residence League - Field size_v2.png"
           alt="Residence League Field Size"
           class="responsive-image">
    </section>

    <!-- League Handbook PDF -->
    <section class="pdf-container">
      <h2>League Handbook</h2>
      <embed
        src="assets/docs/Rules-of-Ultimate - STB 5v5 edition.pdf"
        type="application/pdf"
        class="responsive-pdf"
        title="League Handbook PDF">
    </section>
  </main>

  <footer class="site-footer">
    &copy; <span id="year"></span> Maties Ultimate Frisbee
  </footer>

  <script>
    // auto-update footer year
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
